; The backend settings this mod is tested against.
;
; This file is a reference, not a file the game reads. Copy the values into
; the dxwrapper.ini that sits beside dxwrapper.dll in the game folder. Only
; the settings that matter are listed. Leave everything else at the default.
;
; Layout in the game folder:
;
;     ddraw.dll               the mod
;     dxwrapper\ddraw.dll     dxwrapper's own stub, which must keep this name
;     dxwrapper\dxwrapper.dll
;     dxwrapper\dxwrapper.ini
;
; The stub reads its wrapper mode from its own file name and loads
; dxwrapper.dll from its own directory. Renaming it breaks the game.

[General]
RealDllPath                = C:\Windows\SysWOW64\ddraw.dll
DisableLogging             = 1

[Compatibility]
; Direct3D 7 to Direct3D 9.
Dd7to9                     = 1
; Direct3D 9Ex, which the mod needs. A shared surface reaches Direct3D 11
; only from a 9Ex device, and that is how the frame gets to the headset
; without a copy through system memory.
D3d9to9Ex                  = 1

[Dd7to9]
DdrawAllowMultiSampling    = 1

; KEEP THIS AT 0.
;
; It rebuilds a full mip chain every time a texture is updated, and the game
; updates its landscape texture as the camera moves. The cost lands on the
; GPU exactly when the player drags the world:
;
;     on    70 to 82 fps, scene walk 9.3 to 9.9 ms, GPU drain 1.4 ms
;     off   89.7 to 90.0 fps, scene walk 6.5 to 7.1 ms, GPU drain 0.7 ms
;
; Below 90 fps the runtime reprojects, a reprojected frame carries the old
; camera, and the drag lags behind the hand. It reads as a camera with weight
; and inertia, not as a frame rate fault, which is why it took so long to
; find. See docs/backend.md.
DdrawForceMipMapAutoGen    = 0

[d3d9]
AnisotropicFiltering       = 16
AntiAliasing               = 4
; This is the cheap way to get mip chains. Measured against the same scenes
; with no chains at all, it costs nothing:
;
;     no chains                88.7 to 90.0 fps, scene walk 6.21 to 7.60 ms
;     ForceMipMapUsage = 1     88.9 to 90.0 fps, scene walk 4.49 to 7.50 ms
;     DdrawForceMipMapAutoGen  70.8 to 82.3 fps, scene walk 9.32 to 9.89 ms
ForceMipMapUsage           = 1
