;; Settings for the dxwrapper stub in this folder.
;;
;; The file beside this one must keep the name ddraw.dll. dxwrapper takes its
;; mode from the name of the DLL that loads it, and the mod loads this copy as
;; dxwrapper\ddraw.dll.
;;
;; RealDllPath below is a placeholder. Setup writes the true path of the
;; 32 bit system ddraw.dll into it, because Windows is not always on drive C.
;;
[General]
RealDllPath                = C:\Windows\SysWOW64\ddraw.dll
WrapperMode       = ddraw.dll
